<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d34"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38f9d7"/>
      <stop offset="0.5" stop-color="#43a6ff"/>
      <stop offset="1" stop-color="#b44bff"/>
    </linearGradient>
    <linearGradient id="bars" gradientUnits="userSpaceOnUse" x1="372" y1="372" x2="652" y2="652">
      <stop offset="0" stop-color="#38f9d7"/>
      <stop offset="0.5" stop-color="#43a6ff"/>
      <stop offset="1" stop-color="#b44bff"/>
