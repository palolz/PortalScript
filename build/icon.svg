  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <circle cx="512" cy="512" r="270" fill="url(#core)"/>
  <circle cx="512" cy="512" r="270" fill="none" stroke="url(#ring)" stroke-width="44" filter="url(#glow)"/>
  <g stroke="url(#bars)" stroke-width="30" stroke-linecap="round" filter="url(#glow)">
    <line x1="392" y1="472" x2="392" y2="552"/>
    <line x1="452" y1="412" x2="452" y2="612"/>
    <line x1="512" y1="372" x2="512" y2="652"/>
